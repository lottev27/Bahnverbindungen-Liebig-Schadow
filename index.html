<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Abfahrten">
<meta name="theme-color" content="#100d1c">
<meta name="color-scheme" content="dark">
<title>Abfahrten</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #100d1c;
    --panel: rgba(24, 20, 44, .86);
    --line: rgba(255, 255, 255, .09);
    --text: #f3eefc;
    --dim: #a097c7;
    --pink: #ff6fae;
    --mint: #5ff2b0;
    --blue: #6aa8ff;
    --late: #ff8a65;
    --font: "Bricolage Grotesque", "Avenir Next", system-ui, -apple-system, sans-serif;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *, *::before, *::after { box-sizing: inherit; }
  html {
    background:
      radial-gradient(70% 38% at 100% 0%, rgba(255, 111, 174, .26), transparent 70%),
      radial-gradient(60% 34% at 0% 88%, rgba(95, 242, 176, .14), transparent 70%),
      var(--bg);
  }
  body {
    margin: 0;
    min-height: 100vh;
    color: var(--text);
    font-family: var(--font);
    font-size: 18px;
    line-height: 1.15;
    -webkit-text-size-adjust: 100%;
    overflow-x: hidden;
  }

  /* abstrakter Hintergrund aus Formen */
  .art { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
  .wrap { position: relative; z-index: 1; max-width: 640px; margin: 0 auto; padding: 16px 14px 32px; }

  /* Tafel */
  .board {
    background: var(--panel);
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, .14);
    border-radius: 18px;
    box-shadow: 0 18px 50px rgba(0, 0, 0, .45);
    overflow: hidden;
  }
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px 12px;
    border-top: 4px solid transparent;
    border-image: linear-gradient(90deg, var(--pink), var(--mint), var(--blue)) 1;
    border-bottom: 1px solid var(--line);
  }
  .topbar .title { font-size: 1.45rem; font-weight: 800; letter-spacing: -.01em; }
  #clock {
    font-size: 1.7rem;
    font-weight: 700;
    line-height: 1;
    color: var(--mint);
    font-variant-numeric: tabular-nums;
  }

  .cols, .row {
    display: grid;
    grid-template-columns: 3.1rem minmax(0, 1fr) 3.4rem 3.2rem;
    column-gap: 8px;
    align-items: center;
    padding: 0 16px;
  }
  .cols {
    padding-top: 9px;
    padding-bottom: 7px;
    font-size: .82rem;
    font-weight: 600;
    color: var(--dim);
    border-bottom: 1px solid var(--line);
  }
  .cols .t, .row .t { text-align: right; }

  .row {
    min-height: 3.8rem;
    padding-top: 8px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--line);
    font-weight: 600;
  }
  .row:last-child { border-bottom: 0; }
  .row.gone { opacity: .55; }

  .badge {
    display: grid;
    place-items: center;
    min-width: 2.8rem;
    height: 2.2rem;
    padding: 0 .3rem;
    font-size: 1.2rem;
    font-weight: 800;
    color: #0d0a18;
    background: var(--mint);
    border-radius: 8px;
  }
  .badge.bus { background: var(--pink); border-radius: 999px; }

  .dest {
    display: -webkit-box;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 2;
    overflow: hidden;
    overflow-wrap: anywhere;
    font-size: 1.2rem;
    font-weight: 600;
    line-height: 1.1;
    letter-spacing: -.005em;
  }
  .row.gone .dest { text-decoration: line-through; }

  .clock-col { text-align: right; font-size: 1.1rem; font-variant-numeric: tabular-nums; }
  .clock-col .plus { display: block; font-size: .8rem; font-weight: 700; color: var(--late); margin-top: 1px; }
  .clock-col.late { color: var(--late); }
  .clock-col.sched { color: var(--dim); font-weight: 500; }

  .mins { text-align: right; font-size: 1.8rem; font-weight: 800; color: var(--pink); font-variant-numeric: tabular-nums; }
  .mins.now { font-size: 1.1rem; color: var(--mint); }
  .mins.cancel { font-size: .8rem; color: var(--late); line-height: 1.05; }

  .msg { padding: 16px; font-size: 1rem; font-weight: 500; color: var(--dim); }
  .msg.error { color: var(--late); }

  footer { margin: 16px 6px 0; font-size: .85rem; color: var(--dim); }
  footer.error #status { color: var(--late); font-weight: 600; }
  footer a { color: var(--dim); text-decoration: underline; }
  .src { margin-top: 5px; }

  @media (max-width: 360px) {
    .cols, .row { grid-template-columns: 2.8rem minmax(0, 1fr) 3.1rem 3rem; column-gap: 6px; padding: 0 12px; }
    .dest { font-size: 1.1rem; }
    .mins { font-size: 1.55rem; }
  }
</style>
</head>
<body>
<svg class="art" viewBox="0 0 400 800" preserveAspectRatio="xMidYMid slice" aria-hidden="true" focusable="false">
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#ffffff" fill-opacity=".22"/>
    </pattern>
  </defs>
  <!-- Ringe oben rechts -->
  <circle cx="352" cy="96" r="150" fill="none" stroke="#ff6fae" stroke-opacity=".34" stroke-width="1.5"/>
  <circle cx="352" cy="96" r="104" fill="none" stroke="#ff6fae" stroke-opacity=".20" stroke-width="1.5"/>
  <circle cx="352" cy="96" r="58" fill="#ff6fae" fill-opacity=".10"/>
  <!-- große Flächen unten -->
  <circle cx="24" cy="708" r="176" fill="#5ff2b0" fill-opacity=".09"/>
  <path d="M400 520a150 150 0 0 0-150 150 150 150 0 0 0 150 150z" fill="#6aa8ff" fill-opacity=".12"/>
  <!-- Punktraster -->
  <rect x="26" y="452" width="176" height="154" fill="url(#dots)"/>
  <rect x="236" y="26" width="120" height="66" fill="url(#dots)"/>
  <!-- diagonale Linien -->
  <g stroke="#ffffff" stroke-opacity=".07" stroke-width="1.2">
    <line x1="-20" y1="330" x2="180" y2="130"/>
    <line x1="-20" y1="370" x2="220" y2="130"/>
    <line x1="-20" y1="410" x2="260" y2="130"/>
    <line x1="260" y1="800" x2="440" y2="620"/>
    <line x1="220" y1="800" x2="440" y2="580"/>
  </g>
  <!-- kleine Kreuze -->
  <g stroke="#5ff2b0" stroke-opacity=".7" stroke-width="2" stroke-linecap="round">
    <path d="M60 180h14M67 173v14"/>
    <path d="M330 402h14M337 395v14"/>
    <path d="M150 742h14M157 735v14"/>
  </g>
  <g stroke="#ff6fae" stroke-opacity=".7" stroke-width="2" stroke-linecap="round">
    <path d="M24 470h14M31 463v14"/>
    <path d="M304 668h14M311 661v14"/>
  </g>
  <!-- kleine Ringe -->
  <circle cx="108" cy="28" r="7" fill="none" stroke="#6aa8ff" stroke-opacity=".7" stroke-width="2"/>
  <circle cx="376" cy="316" r="9" fill="none" stroke="#5ff2b0" stroke-opacity=".5" stroke-width="2"/>
  <circle cx="196" cy="770" r="6" fill="#ff6fae" fill-opacity=".6"/>
</svg>

<div class="wrap">
  <div class="board">
    <div class="topbar">
      <div class="title">Abfahrten</div>
      <div id="clock" aria-label="Aktuelle Uhrzeit">--:--</div>
    </div>
    <div class="cols" aria-hidden="true">
      <div>Linie</div><div>Ziel</div><div class="t">Zeit</div><div class="t">Min</div>
    </div>
    <div id="rows" aria-live="polite"></div>
  </div>

  <footer id="foot">
    <div id="status">Lade Abfahrten …</div>
    <div class="src">Daten: <a href="https://transitous.org/sources/" target="_blank" rel="noopener">Transitous</a> und die Verkehrsunternehmen</div>
  </footer>
</div>

<script>
/* ---------------------------------------------------------------
   Einstellungen
   - queries: Suchbegriffe für die Haltestelle (werden nacheinander probiert)
   - match:   Teil des Namens, an dem die richtige Haltestelle erkannt wird
   - lines:   nur diese Linien anzeigen (leer = alle)
   - ids:     optional feste Haltestellen-IDs, dann entfällt die Suche
---------------------------------------------------------------- */
const API = 'https://api.transitous.org/api';
const REFRESH_MS = 60000;      // Daten jede Minute neu laden
const PER_DIRECTION = 3;       // so viele Abfahrten pro Linie und Richtung
const MAX_ROWS = 14;           // so viele Zeilen insgesamt

const STOPS = [
  { title: 'Liebigstraße',  queries: ['Köln Liebigstr.',  'Liebigstraße Köln'],  match: 'liebig',  lines: ['5'] },
  { title: 'Schadowstraße', queries: ['Köln Schadowstr.', 'Schadowstraße Köln'], match: 'schadow', lines: ['142'] }
];

/* --------------------------------------------------------------- */
const KOELN = { lat: 50.94, lon: 6.96 };
const nearKoeln = m => {
  const dLat = (m.lat - KOELN.lat) * 111;
  const dLon = (m.lon - KOELN.lon) * 111 * Math.cos(KOELN.lat * Math.PI / 180);
  return Math.hypot(dLat, dLon) < 25;
};

const state = STOPS.map(() => ({ departures: null, updated: null, error: null, unfiltered: false }));
const rowsEl = document.getElementById('rows');
const footEl = document.getElementById('foot');
const statusEl = document.getElementById('status');
const clockEl = document.getElementById('clock');

const TZ = 'Europe/Berlin';
const fmtTime = d => new Date(d).toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit', timeZone: TZ });
const fmtSec  = d => new Date(d).toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit', second: '2-digit', timeZone: TZ });

function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
}

async function getJSON(url) {
  let res;
  try {
    res = await fetch(url, { headers: { Accept: 'application/json' } });
  } catch (e) {
    throw new Error('keine Verbindung zu Transitous');
  }
  if (!res.ok) throw new Error('Fehler ' + res.status);
  return res.json();
}

/* Haltestellen-IDs anhand des Namens finden (nur Treffer in Köln) */
async function resolveStops(s) {
  if (s.ids && s.ids.length) return s.ids;
  const key = 'stops3:' + s.match;
  try {
    const c = JSON.parse(localStorage.getItem(key) || 'null');
    if (Array.isArray(c) && c.length) return c;
  } catch (e) {}
  let ids = [];
  for (const q of s.queries) {
    const r = await getJSON(`${API}/v1/geocode?text=${encodeURIComponent(q)}&type=STOP&language=de`);
    const hits = (Array.isArray(r) ? r : []).filter(m =>
      m.type === 'STOP' && m.id && String(m.name || '').toLowerCase().includes(s.match) && nearKoeln(m));
    ids = hits.slice(0, 3).map(m => m.id);
    if (ids.length) break;
  }
  if (!ids.length) throw new Error('Haltestelle nicht gefunden');
  try { localStorage.setItem(key, JSON.stringify(ids)); } catch (e) {}
  return ids;
}

async function fetchStopTimes(id) {
  const q = `stopId=${encodeURIComponent(id)}&n=50`;
  let lastErr;
  for (const v of ['v6', 'v5']) {
    try {
      const r = await getJSON(`${API}/${v}/stoptimes?${q}`);
      return r.stopTimes || [];
    } catch (e) { lastErr = e; }
  }
  throw lastErr;
}

/* Rohdaten in ein einheitliches Format bringen */
function normalize(st) {
  const p = st.place || {};
  const planned = p.scheduledDeparture || p.departure;
  if (!planned) return null;
  const actual = p.departure || planned;
  let line = String(st.routeShortName || '').trim();
  if (!line) line = String(st.displayName || '').trim().split(/\s+/).pop();
  const dest = String(st.headsign || (st.tripTo && st.tripTo.name) || '')
    .replace(/^Köln[\s,]+/i, '').trim() || 'Ziel unbekannt';
  return {
    line,
    dir: dest,
    bus: /BUS/i.test(st.mode || ''),
    plannedWhen: planned,
    when: actual,
    delay: (Date.parse(actual) - Date.parse(planned)) / 1000,
    cancelled: !!(st.cancelled || st.tripCancelled),
    realTime: !!st.realTime,
    tripId: st.tripId || ''
  };
}

async function loadStop(i) {
  const s = STOPS[i];
  try {
    const ids = await resolveStops(s);
    const results = await Promise.allSettled(ids.map(fetchStopTimes));
    const ok = results.filter(r => r.status === 'fulfilled');
    if (!ok.length) {
      if (!(s.ids && s.ids.length)) { try { localStorage.removeItem('stops3:' + s.match); } catch (e) {} }
      throw results[0].reason;
    }
    const seen = new Set();
    let deps = [];
    ok.forEach(r => r.value.forEach(st => {
      const d = normalize(st);
      if (!d) return;
      const k = d.tripId + '|' + d.plannedWhen + '|' + d.line;
      if (seen.has(k)) return;
      seen.add(k);
      deps.push(d);
    }));
    let unfiltered = false;
    if (s.lines && s.lines.length) {
      const filtered = deps.filter(d => s.lines.includes(d.line));
      if (filtered.length) deps = filtered; else if (deps.length) unfiltered = true;
    }
    state[i] = { departures: deps, updated: Date.now(), error: null, unfiltered };
  } catch (e) {
    state[i].error = e.message || 'Fehler';
  }
}

async function loadAll() {
  await Promise.all(STOPS.map((_, i) => loadStop(i)));
  render();
}

const timeOf = d => Date.parse(d.cancelled ? d.plannedWhen : d.when);
const delayMin = d => Math.round((d.delay || 0) / 60);
const minsUntil = (d, now) => Math.ceil((timeOf(d) - now) / 60000);

/* Alle Haltestellen zu einer Liste zusammenführen:
   pro Haltestelle, Linie und Richtung die nächsten Abfahrten, danach nach Zeit sortiert */
function mergedRows(now) {
  const perGroup = new Map();
  state.forEach((st, i) => {
    (st.departures || []).forEach(d => {
      if (timeOf(d) <= now - 30000) return;
      const key = i + '|' + d.line + '|' + d.dir;
      if (!perGroup.has(key)) perGroup.set(key, []);
      perGroup.get(key).push(d);
    });
  });
  let all = [];
  perGroup.forEach(list => {
    list.sort((a, b) => timeOf(a) - timeOf(b));
    all = all.concat(list.slice(0, PER_DIRECTION));
  });
  all.sort((a, b) => timeOf(a) - timeOf(b));
  return all.slice(0, MAX_ROWS);
}

function renderRow(d, now) {
  const gone = d.cancelled;
  const row = el('div', 'row' + (gone ? ' gone' : ''));
  row.appendChild(el('div', 'badge' + (d.bus ? ' bus' : ''), d.line));
  row.appendChild(el('div', 'dest', d.dir));

  const late = gone ? 0 : delayMin(d);
  const cls = 'clock-col t' + (late >= 1 ? ' late' : '') + (!d.realTime && !gone ? ' sched' : '');
  const tc = el('div', cls, fmtTime(gone ? d.plannedWhen : d.when));
  if (late >= 1) tc.appendChild(el('span', 'plus', '+' + late));
  row.appendChild(tc);

  const mins = el('div', 't mins');
  if (gone) {
    mins.className = 't mins cancel';
    mins.textContent = 'fällt aus';
  } else {
    const m = minsUntil(d, now);
    if (m <= 0) { mins.className = 't mins now'; mins.textContent = 'jetzt'; }
    else mins.textContent = String(m);
  }
  row.appendChild(mins);
  return row;
}

function render() {
  const now = Date.now();
  rowsEl.replaceChildren();

  const rows = mergedRows(now);
  const loaded = state.some(st => st.departures);
  const errors = [];
  let latest = 0;

  state.forEach((st, i) => {
    if (st.updated) latest = Math.max(latest, st.updated);
    if (st.error) errors.push(STOPS[i].title + ': ' + st.error);
    if (st.unfiltered) errors.push('Linie ' + STOPS[i].lines.join(', ') + ' nicht gefunden');
  });

  if (rows.length) {
    rows.forEach(d => rowsEl.appendChild(renderRow(d, now)));
  } else if (loaded) {
    rowsEl.appendChild(el('div', 'msg', 'Keine Abfahrten in nächster Zeit.'));
  } else if (errors.length) {
    rowsEl.appendChild(el('div', 'msg error', 'Abfahrten konnten nicht geladen werden.'));
  } else {
    rowsEl.appendChild(el('div', 'msg', 'Lade Abfahrten …'));
  }

  footEl.className = errors.length ? 'error' : '';
  if (errors.length) {
    statusEl.textContent = errors.join(' · ') + (latest ? ' · letzte Daten von ' + fmtTime(latest) + ' Uhr' : '');
  } else if (latest) {
    const live = rows.filter(d => d.realTime && !d.cancelled).length;
    const total = rows.filter(d => !d.cancelled).length;
    statusEl.textContent = 'Stand ' + fmtSec(latest) + ' · Echtzeit bei ' + live + ' von ' + total +
      ' Abfahrten (die übrigen zeigen den Fahrplan)';
  } else {
    statusEl.textContent = 'Lade Abfahrten …';
  }
}

let tick = 0;
setInterval(() => {
  clockEl.textContent = fmtTime(Date.now());
  if (++tick % 5 === 0) render();
}, 1000);
clockEl.textContent = fmtTime(Date.now());

setInterval(() => { if (!document.hidden) loadAll(); }, REFRESH_MS);
document.addEventListener('visibilitychange', () => { if (!document.hidden) loadAll(); });

render();
loadAll();
</script>
</body>
</html>
